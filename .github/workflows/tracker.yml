name: "Digital Releases Tracker & Deploy"

on:
  schedule:
    # 3 times a day: 05:37, 13:37, 19:37 UTC (08:37, 16:37, 22:37 MSK)
    - cron: "37 5,13,19 * * *"
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      date_from:
        description: "Start date (YYYY-MM-DD) for backfill or custom range"
        required: false
        default: ""
      date_to:
        description: "End date (YYYY-MM-DD)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "tracker-and-pages"
  cancel-in-progress: false

jobs:
  track-and-build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Collector Pipeline
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date_from }}" ]; then
            ARGS="$ARGS --from ${{ github.event.inputs.date_from }}"
          fi
          if [ -n "${{ github.event.inputs.date_to }}" ]; then
            ARGS="$ARGS --to ${{ github.event.inputs.date_to }}"
          fi
          python scripts/run_pipeline.py $ARGS

      - name: Build Static Site and SEO Assets
        run: |
          python scripts/build_site.py

      - name: Commit and Push Database & History
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ website/
          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping git commit."
          else
            git commit -m "chore(data): auto-update releases history and website [skip ci]"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "website"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
